services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: trading_journal
      POSTGRES_USER: trading_journal
      POSTGRES_PASSWORD: trading_journal
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trading_journal -d trading_journal"]
      interval: 2s
      timeout: 3s
      retries: 20

  object-storage:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trading_journal
      MINIO_ROOT_PASSWORD: local-development-only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - object-storage-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 20

  object-storage-init:
    image: minio/mc:latest
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://object-storage:9000 trading_journal local-development-only;
      mc mb --ignore-existing local/trading-journal;
      "

volumes:
  postgres-data:
  object-storage-data:
