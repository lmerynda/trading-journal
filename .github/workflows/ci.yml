name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: trading_journal
          POSTGRES_USER: trading_journal
          POSTGRES_PASSWORD: trading_journal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trading_journal -d trading_journal"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgres://trading_journal:trading_journal@localhost:5432/trading_journal

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:boundaries
      - run: npm test
      - run: npm run db:migrate
      - run: npm run build
